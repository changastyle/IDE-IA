<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game (versión simple)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #1a1a2e; }
    </style>
</head>
<body>
    <header id="hud">
        <span id="score">Puntuación: 0</span>
        <span id="level">Nivel: 1</span>
        <span id="best">Récord: 0</span>
    </header>

    <main id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay" class="hidden">
            <h1 id="overlayTitle">Game Over</h1>
            <p id="overlayMsg">Pulsa "Reiniciar" o cualquier flecha para jugar otra vez.</p>
            <button id="restartBtn" type="button">Reiniciar</button>
        </div>
    </main>

    <footer id="hint"><a href="/editor-de-mapas.html" id="editorLink">🛠 Editor de niveles</a></footer>

    <script src="audio/sound.js"></script>
    <script src="snake.js"></script>
</body>
</html>
