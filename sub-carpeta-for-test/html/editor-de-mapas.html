<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game — Editor de niveles</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header id="hud">
        <span id="editor-title">🛠 Editor de niveles</span>
        <a id="editorLink" href="/index.html">← Volver al juego</a>
    </header>

    <main id="editor-container">
        <canvas id="editorCanvas" width="400" height="400"></canvas>
        <p id="editor-hint">Haz clic (o arrastra) sobre los cuadraditos para poner o quitar muros.</p>

        <div id="editor-tools">
            <label for="levelName">Nivel nº:</label>
            <input id="levelName" type="number" min="2" step="1" value="2">
            <button id="saveBtn" class="editor-btn" type="button">💾 Guardar nivel</button>
            <button id="clearBtn" class="editor-btn" type="button">🧹 Limpiar tablero</button>
        </div>

        <div id="level-list"></div>

        <button id="playClassicBtn" class="editor-btn classic" type="button">▶ Jugar nivel clásico (sin muros)</button>
    </main>

    <script src="/js/editor.js"></script>
</body>
</html>
