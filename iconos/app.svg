<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2126"/>
      <stop offset="1" stop-color="#17181c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fdb"/>
      <stop offset="1" stop-color="#5b8def"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Llave izquierda < -->
  <path d="M180 140 L100 256 L180 372"
        fill="none" stroke="url(#accent)" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Llave derecha > -->
  <path d="M332 140 L412 256 L332 372"
        fill="none" stroke="url(#accent)" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash central / -->
  <line x1="300" y1="160" x2="212" y2="352"
        stroke="#e8eaed" stroke-width="24" stroke-linecap="round" opacity="0.85"/>

  <!-- Spark de IA (estrella de 4 puntas) -->
  <path d="M256 70
           C 262 120, 280 138, 330 144
           C 280 150, 262 168, 256 218
           C 250 168, 232 150, 182 144
           C 232 138, 250 120, 256 70 Z"
        fill="url(#spark)"/>

  <!-- Punto de cursor -->
  <circle cx="256" cy="256" r="10" fill="#a78bfa"/>
</svg>
