  <circle cx="101" cy="29" r="4.2" fill="#c3cad4" stroke="#6b7280" stroke-width="0.6"/>
  <rect x="99.7" y="13" width="2.8" height="14" fill="#a8862a"/>
  <rect x="98.9" y="17.5" width="4.4" height="2.2" fill="#d4af37"/>
