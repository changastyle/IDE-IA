  <circle cx="79" cy="30" r="7.5" fill="url(#plata)" stroke="#6b7280" stroke-width="0.6"/>
  <path d="M72.5 30.5 Q79 44 85.5 30.5 Q79 35.5 72.5 30.5 Z"
