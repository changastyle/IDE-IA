  <circle cx="66.5" cy="72" r="3.8" fill="#c3cad4" stroke="#6b7280" stroke-width="0.6"/>

  <!-- Brazo derecho alzado con Mjölnir -->
  <path d="M87 48 L96 40 L100 31" fill="none" stroke="#939ba6"
