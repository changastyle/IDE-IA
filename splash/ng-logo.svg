<svg width="320" height="160" viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="0.45" stop-color="#c7cdd6"/>
      <stop offset="1" stop-color="#8f97a3"/>
    </linearGradient>
    <linearGradient id="plata2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cad4"/>
      <stop offset="1" stop-color="#7e8794"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d060"/>
      <stop offset="1" stop-color="#8f6f1f"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="roca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4048"/>
      <stop offset="1" stop-color="#171a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
