  <path d="M71 25 L62.5 15.5 L69.5 23.5 Z" fill="#d4af37"/>
  <path d="M87 25 L95.5 15.5 L88.5 23.5 Z" fill="#d4af37"/>

  <!-- El mar, de costa a costa -->
  <path d="M0 139 Q8 134 16 139 T32 139 T48 139 T64 139 T80 139 T96 139
           T112 139 T128 139 T144 139 T160 139 T176 139 T192 139 T208 139
           T224 139 T240 139 T256 139 T272 139 T288 139 T304 139 T320 139
           L320 160 L0 160 Z" fill="#20272e"/>
  <path d="M0 147 Q10 142 20 147 T40 147 T60 147 T80 147 T100 147 T120 147
