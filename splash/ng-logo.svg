  <!-- ============ THOR EN LA ROCA, EL MAR ============ -->

  <!-- Capa dorada al viento -->
  <path d="M70 42 Q52 62 48 88 Q46 106 38 118 L50 113 L48 122 L60 113
           L62 120 L72 110 L74 117 L82 106 Q78 76 88 44 Z"
        fill="url(#oro)" stroke="#a8862a" stroke-width="0.7"/>

  <!-- Roca -->
  <path d="M26 154 L36 136 L46 126 L56 121 L100 121 L110 127 L118 140 L124 154 Z"
