  <path d="M46 126 L56 121 L100 121 L110 127" fill="none"
        stroke="#8f97a3" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M60 128 L66 140 M92 125 L88 138" stroke="#0d0f12"
