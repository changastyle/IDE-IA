           L320 154 L320 160 L0 160 Z" fill="#161b21"/>
  <circle cx="120" cy="143" r="2.4" fill="#9aa4b0" fill-opacity="0.6"/>
  <circle cx="127" cy="148" r="1.7" fill="#9aa4b0" fill-opacity="0.5"/>
  <circle cx="113" cy="149" r="1.5" fill="#9aa4b0" fill-opacity="0.5"/>
  <circle cx="30" cy="146" r="2" fill="#9aa4b0" fill-opacity="0.5"/>

  <!-- ============ ANILLO DE RAYOS ============ -->
  <circle cx="225" cy="80" r="44" fill="url(#glow)"/>
  <circle cx="225" cy="80" r="46" fill="none" stroke="#d4af37"
