  <path d="M58.5 114.5 H69 V121 H56.5 Z" fill="#7e8794" stroke="#6b7280" stroke-width="0.5"/>
  <path d="M88 114.5 H98.5 L100.5 121 H88 Z" fill="#7e8794" stroke="#6b7280" stroke-width="0.5"/>

