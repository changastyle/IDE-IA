  <circle cx="225" cy="80" r="52" fill="none" stroke="#d4af37"
          stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="3 5"/>

  <!-- 8 rayos grandes -->
  <g fill="url(#rayo)" stroke="#a8862a" stroke-width="0.6" stroke-linejoin="round">
    <path d="M229 4 L213 24 L221 26 L209 44 L243 14 L233 12 Z"/>
    <path d="M229 4 L213 24 L221 26 L209 44 L243 14 L233 12 Z" transform="rotate(45 225 80)"/>
    <path d="M229 4 L213 24 L221 26 L209 44 L243 14 L233 12 Z" transform="rotate(90 225 80)"/>
    <path d="M229 4 L213 24 L221 26 L209 44 L243 14 L233 12 Z" transform="rotate(135 225 80)"/>
    <path d="M229 4 L213 24 L221 26 L209 44 L243 14 L233 12 Z" transform="rotate(180 225 80)"/>
    <path d="M229 4 L213 24 L221 26 L209 44 L243 14 L233 12 Z" transform="rotate(225 225 80)"/>
    <path d="M229 4 L213 24 L221 26 L209 44 L243 14 L233 12 Z" transform="rotate(270 225 80)"/>
    <path d="M229 4 L213 24 L221 26 L209 44 L243 14 L233 12 Z" transform="rotate(315 225 80)"/>
  </g>

  <!-- Remaches entre rayos -->
  <g fill="#d4af37" fill-opacity="0.75">
    <path d="M225 17.5 L228.2 21 L225 24.5 L221.8 21 Z" transform="rotate(22.5 225 80)"/>
    <path d="M225 17.5 L228.2 21 L225 24.5 L221.8 21 Z" transform="rotate(67.5 225 80)"/>
    <path d="M225 17.5 L228.2 21 L225 24.5 L221.8 21 Z" transform="rotate(112.5 225 80)"/>
    <path d="M225 17.5 L228.2 21 L225 24.5 L221.8 21 Z" transform="rotate(157.5 225 80)"/>
    <path d="M225 17.5 L228.2 21 L225 24.5 L221.8 21 Z" transform="rotate(202.5 225 80)"/>
    <path d="M225 17.5 L228.2 21 L225 24.5 L221.8 21 Z" transform="rotate(247.5 225 80)"/>
    <path d="M225 17.5 L228.2 21 L225 24.5 L221.8 21 Z" transform="rotate(292.5 225 80)"/>
    <path d="M225 17.5 L228.2 21 L225 24.5 L221.8 21 Z" transform="rotate(337.5 225 80)"/>
  </g>

  <!-- Mjölnir central plateado con NG grabado -->
  <g transform="translate(225 80) scale(0.82) translate(-120 -85)">
    <g stroke="#6b7280" stroke-width="0.8">
      <path d="M88 44 H152 L157 50 V68 L152 74 H88 L83 68 V50 Z" fill="url(#plata)"/>
      <rect x="114" y="74" width="12" height="7" fill="#b6bdc7"/>
      <rect x="115.5" y="81" width="9" height="33" fill="url(#plata2)"/>
    </g>
    <rect x="113.5" y="88" width="13" height="2.6" fill="#d4af37"/>
    <rect x="113.5" y="94" width="13" height="2.6" fill="#d4af37"/>
    <path d="M120 113 L127.5 119.5 L120 126 L112.5 119.5 Z"
          fill="#d4af37" stroke="#a8862a" stroke-width="0.6"/>
    <text x="120" y="66.5" font-family="Didot" font-weight="700" font-size="21"
          letter-spacing="1" fill="#d4af37" text-anchor="middle">NG</text>
  </g>
</svg>
