  <path d="M71 52 H87" stroke="#6b7280" stroke-width="0.6" stroke-opacity="0.5"/>
  <rect x="67.5" y="74" width="20" height="4" fill="#d4af37"/>
  <path d="M68 78 H87 L90 92 L65 92 Z" fill="url(#plata2)" stroke="#6b7280" stroke-width="0.6"/>

  <!-- Brazo izquierdo -->
  <path d="M68 48 L64 60 L66.5 70" fill="none" stroke="#939ba6"
