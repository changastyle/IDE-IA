<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" width="100%" height="100%">
  <style>
    .window { fill: #1e1f22; rx: 10px; }
    .title-bar { fill: #18191b; rx: 10px 10px 0 0; }
    .dot-r { fill: #ff5f56; }
    .dot-y { fill: #ffbd2e; }
    .dot-g { fill: #27c93f; }
    .title-text { fill: #a1a5ab; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; }
    
    .search-bg { fill: #2b2d30; rx: 6px; stroke: #383b3d; stroke-width: 1px; }
    .search-text { fill: #86888b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
    
    /* Filas */
    .item-bg { fill: #2b2d30; rx: 6px; }
    .item-active { fill: #323842; rx: 6px; stroke: #4e88af; stroke-width: 1.5px; }
    
    /* Bloque contenedor de Hostname / Entorno */
    .host-box-ssh { fill: #252321; stroke: #3b2b1b; stroke-width: 1px; rx: 5px; }
    .host-box-local { fill: #212523; stroke: #1b3b2b; stroke-width: 1px; rx: 5px; }
    
    .hostname-ssh { fill: #e59846; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
    .hostname-local { fill: #52c484; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
    
    .badge-ssh { fill: #3b2b1b; rx: 2px; }
    .badge-ssh-text { fill: #e59846; font-family: monospace; font-size: 7px; font-weight: bold; }
    
    .badge-local { fill: #1b3b2b; rx: 2px; }
    .badge-local-text { fill: #52c484; font-family: monospace; font-size: 7px; font-weight: bold; }
    
    /* Textos principales */
    .main-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .sub-path { fill: #86888b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; }
    .date-text { fill: #6f7275; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; }
    
    /* Colores para círculos de tecnologías */
    .circle-python { fill: #3572A5; }
    .circle-java { fill: #b07219; }
    .circle-node { fill: #539e43; }
    .tech-icon-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }

    /* Botón agregar proyecto */
    .add-btn { fill: #25282c; stroke: #3a3f46; stroke-width: 1px; rx: 6px; }
    .add-btn-text { fill: #4a9eff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
  </style>

  <!-- Sombra y Ventana -->
  <rect x="15" y="15" width="690" height="435" rx="10" fill="#000000" opacity="0.4"/>
  <rect x="10" y="10" width="690" height="435" class="window"/>

  <!-- Barra superior -->
  <path d="M 10 20 A 10 10 0 0 1 20 10 L 690 10 A 10 10 0 0 1 700 20 L 700 38 L 10 38 Z" class="title-bar"/>
  <circle cx="28" cy="24" r="6" class="dot-r"/>
  <circle cx="48" cy="24" r="6" class="dot-y"/>
  <circle cx="68" cy="24" r="6" class="dot-g"/>
  <text x="355" y="28" text-anchor="middle" class="title-text">Recent Projects &amp; Workspaces</text>

  <!-- Buscador -->
  <rect x="25" y="52" width="660" height="36" class="search-bg"/>
  <circle cx="42" cy="70" r="5" fill="none" stroke="#86888b" stroke-width="1.5"/>
  <line x1="46" y1="74" x2="52" y2="80" stroke="#86888b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="65" y="74" class="search-text">Filter projects by name, path, or environment...</text>

  <!-- ITEM 1: Chuwi / SSH / Python -->
  <rect x="25" y="100" width="660" height="56" class="item-active"/>
  <rect x="35" y="108" width="70" height="40" class="host-box-ssh"/>
  <text x="70" y="122" text-anchor="middle" class="hostname-ssh">CHUWI</text>
  <rect x="50" y="127" width="40" height="13" class="badge-ssh"/>
  <text x="70" y="136" text-anchor="middle" class="badge-ssh-text">SSH</text>

  <text x="118" y="122" class="main-title">audio-transcriber-ui</text>
  <!-- Bolita de tecnología reubicada al lado del título -->
  <circle cx="262" cy="118" r="10" class="circle-python"/>
  <text x="262" y="119" class="tech-icon-text">Py</text>

  <text x="118" y="138" class="sub-path">192.168.18.55 : ~/Projects/pyqt</text>

  <text x="615" y="122" text-anchor="end" class="date-text">Created: 28/05/2026</text>
  <text x="615" y="138" text-anchor="end" class="date-text" fill="#9da0a2">Modified: Hoy, 12:15</text>

  <g transform="translate(645, 116)" fill="#6f7275" opacity="0.5">
    <path d="M3 3h10v1H3V3zm2-2h6v1H5V1zm1 5h1v8H6V6zm3 0h1v8H9V6zM3 5h10v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5z"/>
  </g>

  <!-- ITEM 2: MacBook / Local / Python -->
  <rect x="25" y="162" width="660" height="56" class="item-bg"/>
  <rect x="35" y="170" width="70" height="40" class="host-box-local"/>
  <text x="70" y="184" text-anchor="middle" class="hostname-local">MACBOOK</text>
  <rect x="50" y="189" width="40" height="13" class="badge-local"/>
  <text x="70" y="198" text-anchor="middle" class="badge-local-text">LOCAL</text>

  <text x="118" y="184" class="main-title" fill="#c7c9cc">docker-whisper-server</text>
  <circle cx="282" cy="180" r="10" class="circle-python"/>
  <text x="282" y="181" class="tech-icon-text">Py</text>

  <text x="118" y="200" class="sub-path">~/Servers/docker/whisper</text>

  <text x="615" y="184" text-anchor="end" class="date-text">Created: 10/04/2026</text>
  <text x="615" y="200" text-anchor="end" class="date-text">Modified: Ayer</text>

  <g transform="translate(645, 178)" fill="#6f7275" opacity="0.5">
    <path d="M3 3h10v1H3V3zm2-2h6v1H5V1zm1 5h1v8H6V6zm3 0h1v8H9V6zM3 5h10v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5z"/>
  </g>

  <!-- ITEM 3: MacBook / Local / Java -->
  <rect x="25" y="224" width="660" height="56" class="item-bg"/>
  <rect x="35" y="232" width="70" height="40" class="host-box-local"/>
  <text x="70" y="246" text-anchor="middle" class="hostname-local">MACBOOK</text>
  <rect x="50" y="251" width="40" height="13" class="badge-local"/>
  <text x="70" y="260" text-anchor="middle" class="badge-local-text">LOCAL</text>

  <text x="118" y="246" class="main-title" fill="#c7c9cc">legacy-backend-core</text>
  <circle cx="266" cy="242" r="10" class="circle-java"/>
  <text x="266" y="243" class="tech-icon-text">Jv</text>

  <text x="118" y="262" class="sub-path">~/Projects/java/enterprise</text>

  <text x="615" y="246" text-anchor="end" class="date-text">Created: 15/01/2025</text>
  <text x="615" y="262" text-anchor="end" class="date-text">Modified: Hace 3 sem.</text>

  <g transform="translate(645, 240)" fill="#6f7275" opacity="0.5">
    <path d="M3 3h10v1H3V3zm2-2h6v1H5V1zm1 5h1v8H6V6zm3 0h1v8H9V6zM3 5h10v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5z"/>
  </g>

  <!-- ITEM 4: Clavaria / SSH / Node -->
  <rect x="25" y="286" width="660" height="56" class="item-bg"/>
  <rect x="35" y="294" width="70" height="40" class="host-box-ssh"/>
  <text x="70" y="308" text-anchor="middle" class="hostname-ssh">CLAVARIA</text>
  <rect x="50" y="313" width="40" height="13" class="badge-ssh"/>
  <text x="70" y="322" text-anchor="middle" class="badge-ssh-text">SSH</text>

  <text x="118" y="308" class="main-title" fill="#c7c9cc">api-gateway-service</text>
  <circle cx="258" cy="304" r="10" class="circle-node"/>
  <text x="258" y="305" class="tech-icon-text">Js</text>

  <text x="118" y="324" class="sub-path">192.168.18.99 : ~/Projects/node</text>

  <text x="615" y="308" text-anchor="end" class="date-text">Created: 02/05/2026</text>
  <text x="615" y="324" text-anchor="end" class="date-text">Modified: 04/06/2026</text>

  <g transform="translate(645, 302)" fill="#6f7275" opacity="0.5">
    <path d="M3 3h10v1H3V3zm2-2h6v1H5V1zm1 5h1v8H6V6zm3 0h1v8H9V6zM3 5h10v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5z"/>
  </g>

  <!-- Botón Agregar Nuevo Proyecto -->
  <rect x="25" y="356" width="660" height="34" class="add-btn"/>
  <text x="355" y="377" text-anchor="middle" class="add-btn-text">+ Agregar nuevo proyecto</text>

  <!-- Footer sutil -->
  <text x="35" y="415" class="sub-path" font-size="10px">⏎ Seleccionar • 🗑️ Eliminar de la lista • ⎋ Cerrar</text>
